<body>
<header class="bar">
  <a class="brand" href="./" aria-label="Seán Nolan — Design Vault"><svg class="logo" viewBox="0 0 60 60" role="img" aria-label="Seán Nolan"><path d="M10 10L50 50" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="20"/><circle fill="currentColor" cx="50" cy="10" r="10"/><circle fill="currentColor" cx="10" cy="50" r="10"/></svg><span id="count" class="muted"></span></a>
  <div class="tools">
    <div id="sbox" class="sbox">
      <button id="sbtn" class="ibtn" aria-label="Search" aria-expanded="false" aria-controls="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <input id="q" type="search" placeholder="Search…" aria-label="Search" autocomplete="off" tabindex="-1">
    </div>
    <button id="vbtn" class="ibtn" aria-label="Single column view" aria-pressed="false"><svg class="i-grid" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="9" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="5" rx="1.5"/><rect x="4" y="16" width="6.5" height="4" rx="1.5"/><rect x="13.5" y="12" width="6.5" height="8" rx="1.5"/></svg><svg class="i-list" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg></button>
    <button id="shbtn" class="ibtn" aria-label="Shuffle" aria-pressed="false" title="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h3.2c1.6 0 3 .8 3.9 2.1l2.8 4.8c.9 1.3 2.3 2.1 3.9 2.1h3.2"/><path d="M3.5 17h3.2c1.6 0 3-.8 3.9-2.1l.4-.7M13.1 9.8l.4-.7C14.4 7.8 15.8 7 17.4 7h3.1"/><path d="M18 4.5L20.5 7 18 9.5M18 14.5l2.5 2.5-2.5 2.5"/></svg></button>
    <button id="sugbtn" class="ibtn" hidden aria-label="Suggested" aria-pressed="false" title="Suggested"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4l1.8 4.9L17.7 10.7l-4.9 1.8L11 17.4l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span id="sugn" class="fcount" hidden></span></button>
    <button id="fbtn" class="ibtn" aria-label="Filters" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span id="fcount" class="fcount" hidden></span></button>
  </div>
</header>
<div id="active" class="active" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-label="Filters" hidden>
  <div class="grab"></div>
  <div class="sh-head"><strong>Filters</strong><button id="fclear" class="link">Clear all</button><button id="fclose" class="link">Done</button></div>
  <h4>Source</h4>
  <div class="chips" id="sources">
    <button data-src="all" class="on">All</button><button data-src="x">X</button><button data-src="savee">Savee</button><button data-src="cosmos">Cosmos</button><button data-src="curated">Curated</button><button data-src="savee-email">Savee picks</button><button data-src="liked">Liked</button>
  </div>
  <h4>Sort</h4>
  <div class="chips" id="sort">
    <button data-sort="newest" class="on">Newest</button><button data-sort="saved">Recently saved</button><button data-sort="oldest">Oldest</button><button data-sort="shuffle">Shuffle</button><button data-sort="media">Media first</button>
  </div>
  <h4>Tags</h4>
  <input id="tq" class="tq" type="search" placeholder="Search tags…" autocomplete="off">
  <div class="chips" id="tags"></div>
  <button id="tmore" class="link more" hidden></button>
  <div class="rmrow"><button id="sendrm" class="sendrm" hidden aria-label="Send removals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Send removals<b>0</b></button>
  <textarea id="rmbox" class="rmbox" readonly hidden aria-label="Removed item IDs"></textarea></div>
</section>
<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden>Nothing here yet.</div>
<div id="sentinel"></div>
